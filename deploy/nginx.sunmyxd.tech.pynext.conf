# PyNext 0.1.2 on Uvicorn, two application workers.
upstream gwg_pynext {
    server 127.0.0.1:18083;
    keepalive 16;
}

# Verified PyNext service; the existing PostgreSQL database is retained.
server {
    listen 80;
    listen [::]:80;
    server_name sunmyxd.tech www.sunmyxd.tech;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    access_log /var/log/nginx/gwg_timing.log gwg_timing;
    listen [::]:443 ssl;
    server_name sunmyxd.tech www.sunmyxd.tech;

    ssl_certificate /etc/nginx/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20M;

    # Verification and password-reset links contain tokens.
    location ^~ /auth/ {
        access_log off;
        proxy_pass http://gwg_pynext;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://gwg_pynext;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
