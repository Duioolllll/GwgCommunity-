# Ubuntu host: build on the server's native architecture (amd64 or arm64).
# Use a host HTTPS reverse proxy in front of the loopback-only app port.
name: gwgcommunity
services:
  app:
    image: ${APP_IMAGE:-gwgcommunity:ubuntu}
    build:
      context: ..
      target: runtime
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with host db}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set the public HTTPS origin}
      INVITATION_SECRET: ${INVITATION_SECRET:?Set INVITATION_SECRET}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?Set R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?Set R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?Set R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:?Set R2_BUCKET_NAME}
    depends_on:
      db:
        condition: service_healthy
    networks: [backend, edge]
  migrate:
    image: ${MIGRATION_IMAGE:-gwgcommunity:migrations}
    build:
      context: ..
      target: migrations
    profiles: [tools]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with host db}
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gwg}
      POSTGRES_USER: ${POSTGRES_USER:-gwg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
networks:
  backend:
    internal: true
  edge: {}
volumes:
  db-data: {}
