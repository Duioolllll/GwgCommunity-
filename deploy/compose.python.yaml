name: gwgcommunity-python
# 함께 실행할 앱과 데이터베이스를 아래에 정한다.
services:
  # 웹 요청을 처리할 프로그램의 실행 설정이다.
  app:
    # 이미 만들어진 Docker 이미지와 버전을 선택한다.
    image: ${PYTHON_APP_IMAGE:-gwgcommunity-python:local}
    # 소스 파일로부터 실행용 Docker 이미지를 만드는 방법이다.
    build:
      # 이미지를 만들 때 사용할 소스 폴더다.
      context: ../python_app
    # 실제 접속 주소와 비밀값은 이 설정 파일에서 읽는다.
    env_file: ${PYTHON_ENV_FILE:?set the protected Django env file}
    # 이 프로그램에 전달할 설정값을 아래에 적는다.
    environment:
      # 개발 중 오류 화면을 보여 줄지 정한다. 실제 서비스에서는 0으로 둔다.
      DJANGO_DEBUG: '0'
      # 회원·게시글 등을 저장할 PostgreSQL 데이터베이스의 연결 주소다.
      DJANGO_DATABASE_URL: postgresql://${PYTHON_DB_USER:-gwg}:${PYTHON_DB_PASSWORD:?set a URL-safe password}@db:5432/${PYTHON_DB_NAME:-gwg_python}
    # 컴퓨터의 포트와 컨테이너 안의 포트를 연결한다. 127.0.0.1은 같은 컴퓨터에서만 접속할 수 있다.
    ports:
      - '127.0.0.1:${PYTHON_APP_PORT:-18080}:8000'
    # 아래 서비스가 준비된 후 앱을 시작한다.
    depends_on:
      # 회원·게시글 정보를 저장할 데이터베이스의 실행 설정이다.
      db:
        # 데이터베이스의 상태 확인을 통과해야 앱을 시작하도록 한다.
        condition: service_healthy
    # 서버나 데이터베이스가 정상적으로 응답하는지 주기적으로 확인한다.
    healthcheck:
      # 아래 명령이 성공하면 정상적으로 동작한다고 판단한다.
      test: ['CMD', 'python', '-c', 'import urllib.request; r=urllib.request.Request("http://127.0.0.1:8000/healthz/", headers={"Host":"localhost","X-Forwarded-Proto":"https"}); urllib.request.urlopen(r, timeout=5)']
      # 상태를 확인하는 시간 간격이다.
      interval: 30s
      # 한 번 확인할 때 응답을 기다릴 최대 시간이다.
      timeout: 10s
      # 처음 켜질 때 준비 시간을 주고 이 동안의 실패는 바로 고장으로 세지 않는다.
      start_period: 20s
      # 상태 확인이 연속으로 몇 번 실패하면 비정상으로 볼지 정한다.
      retries: 3
    # 사용자가 직접 멈춘 경우가 아니면 꺼졌을 때 다시 실행한다.
    restart: unless-stopped
    # 종료된 하위 작업을 정리할 작은 관리 프로그램을 함께 실행한다.
    init: true
    # 실행 중 더 높은 권한을 얻지 못하도록 제한한다.
    security_opt: ['no-new-privileges:true']
  # 회원·게시글 정보를 저장할 데이터베이스의 실행 설정이다.
  db:
    # 이미 만들어진 Docker 이미지와 버전을 선택한다.
    image: postgres:17
    # 이 프로그램에 전달할 설정값을 아래에 적는다.
    environment:
      # 테스트 또는 개발용 데이터베이스에 만들 계정 이름이다.
      POSTGRES_USER: ${PYTHON_DB_USER:-gwg}
      # 아래 데이터베이스 계정의 비밀번호다. 예제의 값은 운영에 사용하지 않는다.
      POSTGRES_PASSWORD: ${PYTHON_DB_PASSWORD:?set a URL-safe password}
      # 처음 만들 데이터베이스 이름이다.
      POSTGRES_DB: ${PYTHON_DB_NAME:-gwg_python}
    # 컨테이너를 바꾸어도 남겨야 할 데이터의 저장 위치다.
    volumes:
      - python-db:/var/lib/postgresql/data
    # 서버나 데이터베이스가 정상적으로 응답하는지 주기적으로 확인한다.
    healthcheck:
      # 아래 명령이 성공하면 정상적으로 동작한다고 판단한다.
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      # 상태를 확인하는 시간 간격이다.
      interval: 5s
      # 한 번 확인할 때 응답을 기다릴 최대 시간이다.
      timeout: 5s
      # 상태 확인이 연속으로 몇 번 실패하면 비정상으로 볼지 정한다.
      retries: 12
    # 사용자가 직접 멈춘 경우가 아니면 꺼졌을 때 다시 실행한다.
    restart: unless-stopped
# 컨테이너를 바꾸어도 남겨야 할 데이터의 저장 위치다.
volumes:
  python-db:
