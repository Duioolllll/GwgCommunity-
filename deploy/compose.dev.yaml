# Local development database. The production compose must not publish the DB port.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: gwg
      POSTGRES_USER: gwg
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - gwg-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gwg -d gwg"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  gwg-dev-db:
