name: CI
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gwg
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: gwg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gwg -d gwg_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://gwg:test-only@localhost:5432/gwg_test
      TEST_DATABASE_URL: postgresql://gwg:test-only@localhost:5432/gwg_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:check
      - run: pnpm db:migrate
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm build
