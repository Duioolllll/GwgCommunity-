name: Python CI
on: [push, pull_request]
jobs:
  django:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gwg
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: gwg_python_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gwg -d gwg_python_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: '1'
      DJANGO_DATABASE_URL: postgresql://gwg:test-only@127.0.0.1:5432/gwg_python_ci
      DJANGO_TEST_DATABASE_NAME: test_gwg_python_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python_app/requirements.txt
      - run: python -m pip install -r python_app/requirements.txt
      - run: python python_app/manage.py check
      - run: python python_app/manage.py makemigrations --check --dry-run
      - run: python python_app/manage.py test core --verbosity 2
      - run: python python_app/manage.py collectstatic --noinput
      - run: python python_app/tests/verify_legacy_import.py
        env:
          GWG_TEST_POSTGRES_ADMIN_URL: postgresql://gwg:test-only@127.0.0.1:5432/postgres
