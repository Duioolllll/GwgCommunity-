name: Linux image build (amd64 and arm64)
on:
  # 코드 변경 검토 요청이 생기면 자동 검사를 시작한다.
  pull_request:
  # 코드가 올라오면 자동 검사를 시작한다.
  push:
    # 이름이 일치하는 브랜치에 코드가 올라올 때 실행한다.
    branches: [main]
  # GitHub 화면에서 직접 검사를 실행할 수도 있다.
  workflow_dispatch:
# 자동 검사에 허용할 GitHub 접근 권한이다.
permissions:
  # 저장소 내용을 읽는 권한만 허용한다.
  contents: read
# 자동으로 실행할 검사 작업을 아래에 정의한다.
jobs:
  # 소스 파일로부터 실행용 Docker 이미지를 만드는 방법이다.
  build:
    # 검사를 실행할 컴퓨터의 운영체제다.
    runs-on: ubuntu-latest
    # 위에서 아래 순서대로 검사 준비와 실행을 진행한다.
    steps:
      # 검사할 저장소의 소스 파일을 내려받는다.
      - uses: actions/checkout@v4
      # 다른 종류의 CPU에서 실행할 이미지도 만들 수 있게 준비한다.
      - uses: docker/setup-qemu-action@v3
      # 여러 CPU용 Docker 이미지를 만들 도구를 준비한다.
      - uses: docker/setup-buildx-action@v3
      - name: Prepare image name
        id: image
        # 아래 셸 명령을 실행해 이 검사 단계의 작업을 처리한다.
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          repo="${repo%-}"
          echo "name=ghcr.io/${repo}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build Linux images without publishing
        # Docker 이미지를 실제로 빌드해 만드는 과정에 오류가 없는지 확인한다.
        uses: docker/build-push-action@v6
        with:
          # 이미지를 만들 때 사용할 소스 폴더다.
          context: ./pynext_app
          # 일반 PC용과 ARM 컴퓨터용 이미지를 모두 만들어 본다.
          platforms: linux/amd64,linux/arm64
          # 만든 이미지를 외부 이미지 저장소에 올리지는 않는다.
          push: false
          tags: ${{ steps.image.outputs.name }}
          # 앞선 실행에서 저장한 빌드 결과를 다시 사용해 시간을 줄인다.
          cache-from: type=gha
          # 다음 실행이 재사용할 수 있도록 빌드 결과를 저장한다.
          cache-to: type=gha,mode=max
